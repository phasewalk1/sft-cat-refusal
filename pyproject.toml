[project]
name = "sft-kitty"
version = "0.1.0"
description = "Local Qwen3.5 cat-refusal SFT and red-teaming harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "peft>=0.21,<0.22",
    "safetensors>=0.8,<0.9",
    "torch>=2.14,<2.15",
    "transformers>=5.5,<5.6",
    "typer>=0.16",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "seaborn>=0.13.2",
]

[project.scripts]
whisker = "whisker.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.13",
    "tinker-cookbook>=0.5.7,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires the cached 4B model and Apple MPS"]

[tool.ruff]
line-length = 100
target-version = "py312"
